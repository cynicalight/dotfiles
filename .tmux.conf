unbind %
bind '\' split-window -h

unbind '"'
bind - split-window -v

# unbind the default if you want a totally different key
unbind [

# bind a new key to enter copy-mode
bind-key v copy-mode

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

bind -n PageUp copy-mode \; send-keys -X halfpage-up
bind -n PageDown send-keys -X halfpage-down

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
bind-key y setw synchronize-panes

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# for image.nvim
set -g allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

set -g mouse on
set -g set-clipboard on
# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# image.nvim problem

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b "$HOME/.tmux/plugins/tpm/tpm"


# ============================================================
#  Custom Powerline Theme — Mauve (#BA92B2)
#  Drop-in replacement for: powerline/double/magenta
#  Paste this block at the BOTTOM of ~/.tmux.conf
#  (after `run '~/.tmux/plugins/tpm/tpm'` if you use tpm)
# ============================================================

# -------- Palette --------
# accent     = #BA92B2   (mauve — main theme color)
# accent_dim = #765D71   (darker mauve for inactive accents)
# bg         = #1e1e2e   (status bar background)
# bg_alt     = #313244   (secondary bar segment)
# fg         = #cdd6f4   (default text)
# fg_dim     = #6c7086   (inactive text)
# white      = #f8f8f2
# border_dim = #44475a

# -------- Status bar base --------
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify centre
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# -------- Status left (session + memory history) --------
# Double-chevron session plus an 8-sample physical-memory occupancy graph
set -g status-left-length 60
set -g status-left '#[fg=#1e1e2e,bg=#BA92B2,bold] #S #[fg=#BA92B2,bg=#765D71]#[fg=#cdd6f4,bg=#765D71] #($HOME/dotfiles/scripts/tmux-memory-graph #{pid}) #[fg=#765D71,bg=#1e1e2e] '

# -------- Status right (date + time) --------
# Double-chevron powerline style:   date  time
set -g status-right-length 120
set -g status-right '#[fg=#765D71,bg=#1e1e2e]#[fg=#cdd6f4,bg=#765D71] %Y-%m-%d #[fg=#BA92B2,bg=#765D71]#[fg=#1e1e2e,bg=#BA92B2,bold] %H:%M '

# -------- Windows --------
set -g window-status-separator ' '
set -g window-status-format         '#[fg=#313244,bg=#1e1e2e]#[fg=#6c7086,bg=#313244] #I:#W #[fg=#313244,bg=#1e1e2e]'
set -g window-status-current-format '#[fg=#BA92B2,bg=#1e1e2e]#[fg=#1e1e2e,bg=#BA92B2,bold] #I:#W #[fg=#BA92B2,bg=#1e1e2e]'

# Window activity / bell
set -g window-status-activity-style 'fg=#f38ba8 bg=#1e1e2e bold'
set -g window-status-bell-style     'fg=#f38ba8 bg=#1e1e2e bold'

# -------- Panes --------
set -g pane-border-style        'fg=#44475a'
set -g pane-active-border-style 'fg=#BA92B2,bold'
set -g pane-border-lines        heavy

# Pane labels on top border
set -g pane-border-status bottom
set -g pane-border-format '#{?pane_active,#[fg=#BA92B2#,bold]━━━ 👀 ━━━,#[fg=#6c7086]─── #P:#{pane_current_command} ───}'

# -------- Messages / command prompt --------
set -g message-style         'fg=#1e1e2e bg=#BA92B2 bold'
set -g message-command-style 'fg=#cdd6f4 bg=#313244'

# -------- Copy mode / selection --------
set -g mode-style 'fg=#1e1e2e bg=#BA92B2 bold'

# -------- Clock mode (prefix + t) --------
set -g clock-mode-colour '#BA92B2'
set -g clock-mode-style  24
bind-key -n F1 run-shell 'tmux list-panes -F "##{pane_id}" | while read -r pane; do tmux clock-mode -t "$pane"; done'
bind-key -n F3 select-layout even-horizontal

# -------- display-panes (prefix + q) --------
set -g display-panes-active-colour '#BA92B2'
set -g display-panes-colour        '#765D71'
set -g display-panes-time          1000
